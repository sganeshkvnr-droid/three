name: CI Workflow

on:
  push:
    branches-ignore:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Validate Files
        run: |
          ls

          test -f index.html
          test -f style.css
          test -f script.js

          echo "All files exist"

      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          subject: Developer Push Notification

          to: sganeshkvnr@gmail.com
          from: ${{ secrets.EMAIL_USERNAME }}

          body: |
            New code pushed.

            Branch:
            ${{ github.ref_name }}

            Developer:
            ${{ github.actor }}

            Repository:
            ${{ github.repository }}